services:
  postgres:
    image: postgres:16-alpine
    container_name: nebo-spherex-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nebo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nebo_secret}
      POSTGRES_DB: ${POSTGRES_DB:-nebo_spherex}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nebo} -d $${POSTGRES_DB:-nebo_spherex}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
